# LPR-016 (round-26): repository governance — automated dependency updates.
#
# Dependabot opens weekly PRs for outdated npm + GitHub Actions versions.
# Each PR ships with release notes + changelog excerpts and runs the full
# CI gate (lint + tests + a11y + secret scan).
#
# `cooldown` defaults to 3 days so Dependabot waits for the ecosystem to
# shake out a new release before re-opening an update; for backend/security
# updates the cooldown is shorter because the cost of staying on a known-
# vulnerable version is higher than the cost of a churn PR.
#
# Directories: the portal frontend (root package.json) + backend
# (backend/package.json) are separate npm workspaces — Dependabot needs
# one `ecosystem: npm` block per directory. The frontend lives at the
# repo root (./package.json), not under /frontend/, so directory: "/".
#
# ──[PR] Major-version bumps are IGNORED across all ecosystems.───────────
# Why: jumping majors is a breaking-change review task, not a Dependabot
# job. Enabling major bumps here would generate PRs that fail the existing
# CI gate (any new major typically needs manual code changes), creating
# churn and noise. Operators who want majors can either:
#   (a) Edit this file and remove the `ignore: [version-update:semver-major]`
#       block per ecosystem, or
#   (b) Use the GitHub UI: Dependabot → "Allow" → toggle per-package
#       major-version auto-merge.
# Major-version SECURITY advisories still arrive as Dependabot security
# alerts regardless of this ignore (security PRs are a separate channel).
# --------------------------------------------------------------------------

version: 2

updates:
  # ─── Backend (Node) ───────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/backend"
    labels:
      - "dependencies"
      - "backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    # Cap concurrent Dependabot PRs at 5 per ecosystem. Lower than the
    # Dependabot default of 10 because the CI gate is shared with human
    # branches and we don't want Dependabot to flood the queue.
    open-pull-requests-limit: 5
    # Default 3-day cooldown is fine for normal updates; security releases
    # will arrive with a Dependabot security alert which Dependabot opens
    # immediately regardless of this setting.
    cooldown:
      default-days: 3
    # Group minor + patch into one PR so we don't get 12 npm-noise PRs/week.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
    # Major-version bumps ignored — see file header for rationale.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─── Frontend (Node) ──────────────────────────────────────────────────────
  # The frontend package.json lives at the repo ROOT, so directory is "/".
  # (Pre-fix this block said directory: "/frontend" which pointed at a
  # non-existent path and silently no-op'd.)
  - package-ecosystem: "npm"
    directory: "/"
    labels:
      - "dependencies"
      - "frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
    # Major-version bumps ignored — see file header for rationale.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─── GitHub Actions ───────────────────────────────────────────────────────
  # The portal deploys via .github/workflows/*.yml; Dependabot can update
  # the pinned action SHAs without us touching them by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "ci"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Major-version bumps ignored — see file header for rationale.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]