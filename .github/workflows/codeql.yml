# LPR-016 (round-26): repository governance — CodeQL static security scan.
#
# Closes the LPR-016 "no dedicated static security-analysis workflow" gap.
# CodeQL runs on every push to the protected branches + a weekly schedule
# so a vulnerability introduced between scans still gets caught quickly.
#
# Why not just the default CodeQL initialization? The default GitHub-
# managed flow only runs on the default branch + a weekly schedule; this
# workflow also runs on add-react-website (the active dev branch) and on
# PRs from forks via workflow_run, which gives faster feedback than waiting
# for the default branch to advance.
#
# Reference: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/customizing-code-scanning

name: "CodeQL"

on:
  push:
    branches:
      - main
      - add-react-website
  pull_request:
    branches:
      - main
      - add-react-website
  schedule:
    # Weekly Monday 04:00 IST scan — runs regardless of push activity so a
    # silent vulnerability in a long-lived branch still surfaces.
    - cron: "30 22 * * 0"

permissions:
  # Minimum required for the CodeQL action to upload SARIF to the
  # code-scanning dashboard.
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            # Both the backend (Node + Express + Prisma) and the frontend
            # (Vite + React) live in this repo. CodeQL's JS/TS extractor
            # covers both, so a single matrix entry is enough.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required by CodeQL — fetches a single branch shallow enough
          # to scan quickly but deep enough for cross-file dataflow.
          fetch-depth: 0

      # [Fix 2026-10-02] Removed the `paths: ${{ matrix.paths }}` line.
      # Pre-fix this passed a YAML sequence to github/codeql-action/init,
      # which does NOT accept a `paths:` input (verified against v4
      # init/action.yml — the full inputs list is tools / languages /
      # build-mode / config-file / db-location / config / queries /
      # packs / source-root / ram / threads / etc. — no `paths`).
      # GitHub's action runner rejected the key with:
      #   "The template is not valid. .github/workflows/codeql.yml
      #    (Line: 72, Col: 18): A sequence was not expected"
      #
      # Path scoping, if reintroduced, must go through a CodeQL config
      # file passed via the `config-file:` input — the config file
      # itself contains a `paths:` / `paths-ignore:` block. We don't
      # need scoping today: the JS/TS extractor covers both backend and
      # frontend in one pass, and the small amount of noise from
      # docs/ + workflows/ is acceptable.
      #
      # Also bumped @v3 → @v4 across all three action references —
      # v3 is on the deprecation track (December 2026).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # queries: security-and-quality runs the default security pack
          # plus the lint pack (security-extended is heavier; revisit if
          # signal-to-noise becomes a problem in weekly runs).
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # category is the SARIF category surfaced in the Security tab;
          # keep it stable so historical findings stay grouped.
          category: "/language:${{ matrix.language }}"

      # [Fix 2026-10-03] Removed the explicit `upload-sarif` step.
      # In codeql-action v3, analyze wrote the SARIF to
      # `${GITHUB_WORKSPACE}/codeql-results/<language>.sarif` and a
      # separate `upload-sarif` step pushed it to the dashboard. v4
      # changed this: the `analyze` step itself uploads the SARIF
      # directly to GitHub code-scanning when the workflow has
      # `security-events: write` (which we do, see top of file), and
      # the SARIF is no longer written to `codeql-results/` — it goes
      # to `../results` relative to the checkout. Leaving the v3-style
      # upload step in place caused the job to fail with
      # "Path does not exist: .../codeql-results/javascript-typescript.sarif"
      # because the v4 analyze step doesn't write there.
      # The explicit upload step was redundant AND mis-pointed; v4
      # analyze is now the single source of truth for SARIF output.
      # Re-introduce a separate upload step only if v4 stops uploading
      # by default (e.g. for a custom-output setup with
      # `output: sarif-only` in analyze).
