name: Deploy Backend to Render

on:
  push:
    branches: [ add-react-website ]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

# DR-010 fix: serialize backend deploys. Pre-fix, two concurrent
# pushes to `add-react-website` could trigger overlapping Render
# deploys — the second's PUT DEPLOY_SHA would race the first's
# SHA-verify, and the SHA gate would see the second's SHA before
# the first's deploy had finished binding env vars. cancel-in-progress
# means the OLDER run's deploy trigger is cancelled when a newer
# commit lands — older run's tests + drift-gate still happened on
# the older commit, but the actually-deployed SHA is always the
# newest commit that completed pre-deploy checks. Group keyed on
# the service so we don't block the unrelated Pages deploy.
concurrency:
  group: 'render-backend-deploy'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Round-25: regenerate the Prisma client before the test step.
      # The mounted-app integration test imports src/index.js at module load,
      # which calls `new PrismaClient()`. When the schema adds new models
      # (e.g. round-25's NotificationPreference / EmailLog / DigestRun /
      # DigestItem), `node_modules/.prisma/client/default.js` is stale
      # and @prisma/client throws "did not initialize yet". The same
      # `npx prisma generate` is also part of the Render build command
      # (npm install && npx prisma generate) so this keeps CI aligned
      # with production. Idempotent; cheap.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      # LPR-001: deployment no longer runs `prisma db push` (destructive,
      # data-loss-accepting, no migration history). The schema is now reconciled
      # exclusively through checked-in SQL migrations under prisma/migrations/.
      # Render's startup.sh runs `prisma migrate deploy` at boot, which applies
      # only the pending migrations and is idempotent + auditable.
      #
      # Round-11b (still relevant for migrations): Prisma's introspection + DDL
      # hangs on pgbouncer transaction mode (port 6543). Supabase exposes the
      # same hostname on TWO ports:
      #   6543 = transaction-mode pooler (good for app queries, bad for DDL)
      #   5432 = session-mode     pooler (good for migrations, db push)
      # Using port 5432 (no pgbouncer=true flag) for the schema-migrate step.
      - name: Probe Supabase session-mode pooler connectivity
        continue-on-error: true
        run: |
          HOST=$(echo "$SCHEMA_PUSH_URL" | sed -E 's|.*@([^/]+)/.*|\1|' | sed -E 's|:.*||')
          PORT=$(echo "$SCHEMA_PUSH_URL" | sed -E 's|.*@[^:]+:([0-9]+)/.*|\1|')
          echo "Probing $HOST:$PORT (timeout 15s)…"
          timeout 15 bash -c "</dev/tcp/$HOST/$PORT" 2>&1 && echo "TCP OK" || echo "TCP FAIL (rc=$?)"
        env:
          SCHEMA_PUSH_URL: ${{ secrets.SUPABASE_DB_PASSWORD && format('postgresql://postgres.tqmmspqvqtajbijbbsii:{0}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require', secrets.SUPABASE_DB_PASSWORD) || secrets.DATABASE_URL }}

      # LPR-001: dry-run the migration plan first so the workflow logs which
      # migrations WOULD be applied without actually applying anything. If the
      # pending migration list differs from what the owner expects, this is the
      # step that catches it before any DDL hits production.
      #
      # [B-4] Drift gate — fail the deploy if schema.prisma has drifted from
      # the migration folder (a schema change without a checked-in SQL
      # migration). If this ever triggers, the right fix is one of:
      #   1. Add a new migration under prisma/migrations/ capturing the change, OR
      #   2. Revert the schema.prisma edit so it matches the migrations.
      #
      # Implementation note (round-27 follow-up): the previous implementation
      # ran `prisma migrate status`, which exits non-zero for BOTH "drift" AND
      # "pending migrations". Pending migrations are the EXPECTED state on
      # every deploy that introduces a new migration (this round added 3 for
      # S3-6, S3-7, S3-11; previous rounds added 6 more), so the old gate was
      # a false-positive blocker. We considered `prisma migrate diff`, but
      # v5.x requires `--shadow-database-url` to diff against the migrations
      # folder, which adds operational cost and concurrency risk on a shared
      # pooler. Instead we keep `migrate status` (cheap, no shadow DB) and
      # parse its output: "have not yet been applied" → pending (allow;
      # `prisma migrate deploy` in B-1's Render startup.sh will apply them);
      # "Drift" or any other warning/error → real drift or schema error (fail).
      #
      # B-1 follow-up: schema.prisma declares `directUrl = env("DIRECT_DATABASE_URL")`,
      # which Prisma validates at config-load time even for a `migrate status`
      # probe. The drift gate must provide BOTH urls — using the same
      # session-mode (port 5432) pooler is fine because this step only reads
      # `_prisma_migrations`.
      - name: Prisma drift gate (status + drift-only fail)
        run: |
          echo "Running prisma migrate status…"
          set +e
          OUTPUT=$(npx prisma migrate status 2>&1)
          RC=$?
          set -e
          echo "---"
          echo "$OUTPUT"
          echo "---"
          echo "migrate status exit code: $RC"

          if [ "$RC" -eq 0 ]; then
            echo "[drift-gate] DB matches migrations — no pending, no drift"
            exit 0
          fi

          # Non-zero exit. Differentiate pending (expected before a deploy
          # that adds new migrations) from drift (schema changed without a
          # migration — deploy blocker).
          if echo "$OUTPUT" | grep -qiE 'drift|error|failed'; then
            echo "::error::Drift or schema error detected in prisma migrate status output — see above."
            echo "Either add a migration capturing the change, or revert schema.prisma."
            exit 1
          fi

          if echo "$OUTPUT" | grep -qi 'have not yet been applied'; then
            echo "[drift-gate] Pending migrations detected — allowed; B-1's prisma migrate deploy in Render's startup.sh will apply them."
            exit 0
          fi

          # Unknown non-zero exit with no recognized pattern — fail safe.
          echo "::error::prisma migrate status exited $RC with no recognized pattern (not 'drift' and not 'pending')."
          exit 1
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_PASSWORD && format('postgresql://postgres.tqmmspqvqtajbijbbsii:{0}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require', secrets.SUPABASE_DB_PASSWORD) || secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.SUPABASE_DB_PASSWORD && format('postgresql://postgres.tqmmspqvqtajbijbbsii:{0}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require', secrets.SUPABASE_DB_PASSWORD) || secrets.DATABASE_URL }}

      # LPR-001: pre-deploy backup ping — warn-only. This is NOT a real backup;
      # it's the workflow's way of saying "before we touch prod, the operator
      # owning this run should have a fresh snapshot of the production DB".
      # The real backup is taken by the managed Postgres provider's automatic
      # PITR (point-in-time recovery) window. A TODO is logged when no
      # /api/internal/backup-now endpoint is wired in the deployed app yet.
      # The step is non-blocking on purpose: a missing operator-side backup is
      # not a reason to fail the deploy, but a missing logged record IS a reason
      # to make this PR unmergeable in a future, stricter CI policy.
      #
      # [B-4] Updated: a real off-site backup workflow (cron-backup.yml) now
      # exists and writes to R2 daily. Operators can verify with:
      #   aws s3 ls --endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com s3://${R2_BUCKET_DB_BACKUPS}/daily/
      # The "warn-only" pre-deploy reminder is kept here as an operator cue.
      - name: Pre-deploy backup reminder (warn-only)
        if: always()
        run: |
          echo "[LPR-001] Pre-deploy backup reminder:"
          echo "  - Ensure the operator has a recent logical snapshot of the prod DB."
          echo "  - TODO(wiring): wire /api/internal/backup-now when the admin endpoint lands."
          echo "  - Skipping is safe because managed Postgres PITR is the authoritative safety net."

      # Round-27 follow-up: PUT DEPLOY_SHA on Render BEFORE the deploy so
      # the new container reads the new SHA when Render binds env vars at
      # container start. If the PUT happens AFTER the deploy trigger, the
      # new container has already started and reads the OLD DEPLOY_SHA
      # (e.g. the previous deploy's SHA), which fails the SHA-verify step
      # in a way that looks like token drift but isn't. 5s sleep is enough
      # for Render's internal env-var sync (measured <1s; 5s leaves margin
      # without slowing the deploy noticeably).
      - name: Stamp DEPLOY_SHA env var on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          NEW_SHA="${{ github.sha }}"
          echo "[render] PUT DEPLOY_SHA=$NEW_SHA"
          curl -fsS -m 30 -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/srv-da9jvkhf2nfc73fpq230/env-vars/DEPLOY_SHA" \
            -d "{\"value\":\"$NEW_SHA\"}" \
            -w "\nHTTP_STATUS:%{http_code}\n"
          echo "[render] sleeping 5s for env-var propagation"
          sleep 5

      # [B-4] Render deploy trigger — fixes three defects:
      #   1. RENDER_API_KEY was previously referenced as $RENDER_API_KEY but
      #      not declared in the step's env block, so it expanded empty and
      #      Render returned 401 — and the curl had no -f, so the step still
      #      exited 0. Every deploy was silently broken at this step.
      #   2. Now uses -fsS so any HTTP error fails the step.
      #   3. Render returns 202 Accepted for a deploy trigger; we fail loudly
      #      on anything other than 202 (or 200) and echo the response body
      #      for forensics.
      #
      # Round-27 follow-up: Render's API no longer accepts `clearCache` in
      # the body — sending {"clearCache":true,"branch":"..."} returns 400
      # "invalid JSON". The cache-clear option was dropped (or moved to a
      # separate endpoint). Removed it; deploys with no cache clear still
      # pick up fresh npm install via Render's normal build flow.
      #
      # Round-27 follow-up (step-order): this MUST come AFTER the Stamp
      # DEPLOY_SHA step above. Otherwise the new container starts reading
      # env vars before Render's env-vars store sees the PUT, and
      # /version never reports the new SHA.
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          url="https://api.render.com/v1/services/srv-da9jvkhf2nfc73fpq230/deploys"
          # DR-010 fix: pin to the EXACT commit SHA, not a branch ref.
          # Pre-fix the body was `{"branch":"add-react-website"}`, which
          # made Render resolve the branch head at trigger time — so the
          # deployed code could be a newer commit than the one the CI
          # tested. With `commit`, Render deploys that specific SHA
          # regardless of subsequent branch updates. The DEPLOY_SHA env
          # var was independently editable from the same risk family;
          # pinning the deploy request closes it.
          PINNED_SHA="${{ github.sha }}"
          body=$(printf '{"commit":"%s"}' "$PINNED_SHA")
          echo "[render] POST $url (body=$body)"
          response=$(curl -fsS -m 30 -X POST "$url" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$body" \
            -w "\nHTTP_STATUS:%{http_code}")
          echo "$response"
          status=$(echo "$response" | tail -n 1 | sed 's/HTTP_STATUS://')
          case "$status" in
            200|201|202) echo "[render] deploy accepted (status=$status, commit=$PINNED_SHA) — proceeding to SHA verify" ;;
            *) echo "::error::Render deploy trigger returned status=$status (expected 200/201/202)"; exit 1 ;;
          esac

      # [B-4] SHA verification — polls /version until the new SHA is live OR
      # 5 minutes elapse, then asserts equality. Render deploys take 30-90s
      # for free-plan cold starts + bundle download + npm install, so a single
      # fetch was racing the deploy and frequently saw the OLD SHA (or a 404
      # during the brief window when the new container hadn't bound :PORT yet).
      # Polling closes that race.

      - name: Verify exact release SHA via /version
        env:
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          EXPECTED_SHA="${{ github.sha }}"
          echo "Expected SHA: $EXPECTED_SHA"
          deadline=$(( $(date +%s) + 300 ))   # 5-minute total budget
          attempt=0
          DEPLOY_SHA=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            RESP=$(curl -fsS -m 15 -H "X-Internal-Token: $INTERNAL_API_TOKEN" https://acs-chennai.onrender.com/version 2>/dev/null || echo "")
            if [ -z "$RESP" ]; then
              echo "[poll $attempt] /version unreachable (deploy still rolling) — retrying in 10s"
              sleep 10
              continue
            fi
            # Round-27 follow-up: trust the LOCAL comparison of
            # `deploySha` (what /version reports from process.env.DEPLOY_SHA)
            # against `EXPECTED_SHA` (this workflow's own github.sha). Do
            # NOT gate on the server's `matches` field — that field is
            # populated only when Render's `EXPECTED_SHA` env var is set,
            # which it never is (the workflow only knows EXPECTED_SHA
            # locally). The server's `matches` is for ops dashboards; the
            # CI gate is the local string equality. Previous versions of
            # this step required both conditions, which made the gate
            # impossible to satisfy even after the SHAs agreed.
            DEPLOY_SHA=$(echo "$RESP" | sed -n 's/.*"deploySha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            echo "[poll $attempt] deploySha=$DEPLOY_SHA"
            if [ "$DEPLOY_SHA" = "$EXPECTED_SHA" ]; then
              echo "[poll $attempt] SHA verified — release matches the pushed commit"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Release SHA never matched after 5 minutes — expected $EXPECTED_SHA, last live $DEPLOY_SHA"
          exit 1

      - name: Smoke test deployed app
        run: |
          # [B-4] All three probes use `-sS` (NOT `-fsS`) so the HTTP status
          # code is captured even when it's non-2xx. The probe for
          # `/api/dpr/sas-url` and `/api/dpr/notifications` expects 401
          # (auth required, route mounted); using `-f` would make curl exit
          # non-zero on 401, which triggers the `|| echo "000"` fallback,
          # producing "401000" — which the status-comparison logic below
          # would (correctly) reject, but for the wrong reason (script
          # bug, not actual deploy failure). The `|| echo "000"` fallback
          # is kept for true connection failures (network down, container
          # not yet bound). `set -e` would short-circuit before the
          # comparison runs, so we keep the explicit echo + numeric
          # comparison for forensic visibility.
          set +e
          HEALTH=$(curl -sS -o /dev/null -w "%{http_code}" -m 30 https://acs-chennai.onrender.com/health 2>/dev/null || echo "000")
          DPR_SAS=$(curl -sS -o /dev/null -w "%{http_code}" -m 30 -X POST https://acs-chennai.onrender.com/api/dpr/sas-url 2>/dev/null || echo "000")
          DPR_NOTIF=$(curl -sS -o /dev/null -w "%{http_code}" -m 30 "https://acs-chennai.onrender.com/api/dpr/notifications" 2>/dev/null || echo "000")
          echo "Health=$HEALTH DPR_SAS=$DPR_SAS DPR_NOTIF=$DPR_NOTIF"
          # /health must return 200; dpr routes must return 401 (auth required), NOT 404 (route missing)
          if [ "$HEALTH" != "200" ] || [ "$DPR_SAS" != "401" ] || [ "$DPR_NOTIF" != "401" ]; then
            echo "::error::Smoke test failed - expected health=200 dpr=401 (route mounted); got health=$HEALTH dpr_sas=$DPR_SAS dpr_notif=$DPR_NOTIF"
            exit 1
          fi
          exit 0
