name: Deploy Backend to Render

on:
  push:
    branches: [ add-react-website ]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Round-11b: Prisma's introspection + DDL hangs on pgbouncer transaction
      # mode (port 6543). Supabase exposes the same hostname on TWO ports:
      #   6543 = transaction-mode pooler (good for app queries, bad for DDL)
      #   5432 = session-mode     pooler (good for migrations, db push)
      # Using port 5432 (no pgbouncer=true flag) for the schema-push step.
      # Render runtime + seed can keep using port 6543 (transaction-mode).
      - name: Probe Supabase session-mode pooler connectivity
        continue-on-error: true
        run: |
          HOST=$(echo "$SCHEMA_PUSH_URL" | sed -E 's|.*@([^/]+)/.*|\1|' | sed -E 's|:.*||')
          PORT=$(echo "$SCHEMA_PUSH_URL" | sed -E 's|.*@[^:]+:([0-9]+)/.*|\1|')
          echo "Probing $HOST:$PORT (timeout 15s)…"
          timeout 15 bash -c "</dev/tcp/$HOST/$PORT" 2>&1 && echo "TCP OK" || echo "TCP FAIL (rc=$?)"
        env:
          SCHEMA_PUSH_URL: ${{ secrets.SUPABASE_DB_PASSWORD && format('postgresql://postgres.tqmmspqvqtajbijbbsii:{0}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require', secrets.SUPABASE_DB_PASSWORD) || secrets.DATABASE_URL }}

      - name: Push Prisma schema to Supabase (session-mode pooler)
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate --accept-data-loss
        env:
          SCHEMA_PUSH_URL: ${{ secrets.SUPABASE_DB_PASSWORD && format('postgresql://postgres.tqmmspqvqtajbijbbsii:{0}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require', secrets.SUPABASE_DB_PASSWORD) || secrets.DATABASE_URL }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_PASSWORD && format('postgresql://postgres.tqmmspqvqtajbijbbsii:{0}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require', secrets.SUPABASE_DB_PASSWORD) || secrets.DATABASE_URL }}

      - name: Seed database
        run: node prisma/seed.js
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_PASSWORD && format('postgresql://postgres.tqmmspqvqtajbijbbsii:{0}@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=1&sslmode=require', secrets.SUPABASE_DB_PASSWORD) || secrets.DATABASE_URL }}

      - name: Trigger Render Deploy
        run: |
          curl -X POST https://api.render.com/v1/services/srv-da9jvkhf2nfc73fpq230/deploys \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true,"branch":"add-react-website"}'

      - name: Smoke test deployed app
        run: |
          HEALTH=$(curl -sf -o /dev/null -w "%{http_code}" https://acs-chennai.onrender.com/health || echo "000")
          DPR_SAS=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://acs-chennai.onrender.com/api/dpr/sas-url || echo "000")
          DPR_NOTIF=$(curl -s -o /dev/null -w "%{http_code}" "https://acs-chennai.onrender.com/api/dpr/notifications" || echo "000")
          echo "Health=$HEALTH DPR_SAS=$DPR_SAS DPR_NOTIF=$DPR_NOTIF"
          # /health must return 200; dpr routes must return 401 (auth required), NOT 404 (route missing)
          if [ "$HEALTH" != "200" ] || [ "$DPR_SAS" != "401" ] || [ "$DPR_NOTIF" != "401" ]; then
            echo "::error::Smoke test failed - expected health=200 dpr=401 (route mounted)"
            exit 1
          fi
