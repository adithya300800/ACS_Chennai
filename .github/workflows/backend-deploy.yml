name: Deploy Backend to Azure

on:
  push:
    branches: [ add-react-website ]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: acs-portal-api
          slot-name: production
          runtime: NODE:22-lts
          package: .
          app-settings: >
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            NODE_ENV=production
            PORT=3000
            FRONTEND_URL=https://acschennai.com
            WEBSITE_RUN_FROM_PACKAGE=0
            APP_COMMAND_LINE=node /home/site/wwwroot/backend/src/index.js
            WEBSITE_DISABLE_OVERLAPPING_APPS_STARTUP=1
            ZOHO_CLIENT_ID=${{ secrets.ZOHO_CLIENT_ID }}
            ZOHO_CLIENT_SECRET=${{ secrets.ZOHO_CLIENT_SECRET }}
            ZOHO_REDIRECT_URI=https://acs-portal-api.azurewebsites.net/api/auth/zoho/callback
