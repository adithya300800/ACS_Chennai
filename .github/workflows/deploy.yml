# ============================================================
# DEPLOY-WORKFLOW RETIREMENT NOTICE — read before editing
# ============================================================
# This workflow ships the production frontend bundle to GitHub
# Pages at https://acschennai.com.
#
# It is SCHEDULED FOR RETIREMENT once acschennai.com has been cut
# over from GitHub Pages to the Render static site. The full
# ordered runbook lives in docs/HOSTING_CUTOVER.md.
#
# DO NOT disable or delete this workflow until DNS cutover has
# been verified end-to-end. While acschennai.com still resolves
# to GitHub Pages, removing this workflow would freeze the
# production frontend (no further deploys to acschennai.com).
#
# Cutover status (as of last edit):
#   - Render static site https://acs-portal-spa.onrender.com
#     is live and serves the current bundle.
#   - VITE_API_URL is already wired to the Render backend.
#   - Backend CORS already permits both origins.
#   - render.yaml at repo root version-controls the Render config.
#   - What remains: add custom domain, change DNS, verify TLS,
#     disable THIS workflow, then flip the repo private.
#
# See docs/HOSTING_CUTOVER.md sections 5-8 for the exact
# trigger-disable + rollback procedure.
#
# DR-010 fix: the test + build gate now lives in
# frontend-ci.yml (a publisher-independent gate). This Pages
# workflow triggers AFTER frontend-ci has completed successfully
# on the same commit via `workflow_run` — when acschennai.com
# cuts over to Render static site and this workflow is retired,
# the gate stays alive in frontend-ci.yml.
#
# [DR-034 2026-09-23] Release-channel gate: the Pages publisher is
# now bound to the gating workflow's PASS receipt on the exact tested
# SHA. Pre-fix this workflow fired on three event types — push,
# workflow_run (gated), and workflow_dispatch — with only workflow_run
# actually requiring a passing `frontend-ci`. The `push` and bare
# `workflow_dispatch` paths were silent bypasses: any push could publish
# even when `frontend-ci` had failed (or was still running). Audit
# DR-034 acceptance: "A deliberately failing existing check prevents
# normal deployment; successful publication identifies the exact
# checked artifact, even if the branch advances afterward." Both halves
# are addressed below:
#   1. The `push` trigger is REMOVED. Only `workflow_run` (with the
#      gating workflow's `conclusion == 'success'`) and an explicit
#      `workflow_dispatch` with `bypass_gate: true` publish. Every
#      normal push goes through `frontend-ci` first because that
#      workflow's `on.push` covers the same branch + paths.
#   2. The Checkout step pins to `workflow_run.head_sha` — the
#      commit the gating workflow tested. Without this, the default
#      checkout ref is the workflow's default branch, so a Pages
#      publish fired in the gap between a passing test and a new
#      push would publish a *newer* commit than the one tested.
#      Successful publication now always identifies the exact
#      artifact the gate cleared.
# ============================================================

name: Deploy to GitHub Pages

on:
  # DR-010: trigger this Pages publisher AFTER frontend-ci succeeds
  # on the same commit + branch. workflow_run fires once the gating
  # workflow's run is `completed` (with the success/failure branch
  # filter below), regardless of the gating workflow's own trigger
  # event (push, PR, dispatch). branches: filter restricts to the
  # deploy branch so PRs into add-react-website don't accidentally
  # publish Pages on every push.
  workflow_run:
    workflows: ['Frontend CI (test + build gate)']
    types: [completed]
    branches: [ add-react-website ]
  # [DR-034 2026-09-23] Removed the bare `push:` trigger. Pre-fix,
  # `push` here meant "publish on every push to add-react-website
  # (excluding backend/**)" — but without consulting `frontend-ci`,
  # a push could publish while the gate was still running or had
  # already failed. The workflow_run trigger above now covers every
  # push that frontend-ci watches (the gate's own `on.push` matches
  # the same branch + paths filter).
  #
  # [DR-034 2026-09-23] Emergency override: `workflow_dispatch` with
  # `bypass_gate: true` is the audited escape hatch. The default
  # value is `false`, so a bare dispatch (no input) will NOT publish
  # — the build job's `if:` below refuses any workflow_dispatch that
  # does not set `bypass_gate: true`. Per the audit's minimal
  # implementation: "Keep an explicitly authorized emergency
  # override separate rather than weakening every deployment."
  workflow_dispatch:
    inputs:
      bypass_gate:
        description: '[DR-034] Skip the frontend-ci success gate (emergency override only)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # [DR-034 2026-09-23] Release-channel gate: only run when the
    # gating workflow `Frontend CI (test + build gate)` finished
    # `success` on the same head commit (`workflow_run` path), OR
    # an operator explicitly invoked `workflow_dispatch` with
    # `bypass_gate: true` (emergency override path). Pre-fix this
    # condition also accepted bare `push` and bare `workflow_dispatch`,
    # which meant a failing or not-yet-run gate would still publish
    # the Pages bundle — exactly the "release-SHA-can-go-through-even-
    # when-checks-failed" hazard DR-034 calls out.
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success')
      ||
      (github.event_name == 'workflow_dispatch'
        && inputs.bypass_gate == true)
    runs-on: ubuntu-latest
    steps:
      # [DR-034 2026-09-23] Pin Checkout to the exact commit the
      # gating workflow tested. Pre-fix the default ref was used,
      # which in a `workflow_run` context is the workflow's default
      # branch (main) — meaning the publish could advance past the
      # tested SHA between the gate completing and Pages receiving
      # the bundle. The conditional binds `ref` to `head_sha` for
      # the gated path and to the dispatch's ref for the override
      # path; both cases identify the exact checked artifact, even
      # if the branch advances afterward (DR-034 acceptance).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run'
              && github.event.workflow_run.head_sha
              || github.ref }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install backend test dependencies
        # Backend __tests__/* require jsonwebtoken, bcryptjs, etc. which
        # are in backend/package.json (not the root). Without this the
        # test gate fails with "Cannot find module 'jsonwebtoken'" and
        # blocks the Pages deploy.
        run: npm ci --prefix backend --ignore-scripts
      # The test step was removed in DR-010 (now lives in frontend-ci.yml).
      # The build still happens here because Pages needs the artifact
      # locally to upload; frontend-ci also builds, so we re-do the
      # work but with the Pages config (NODE_OPTIONS, VITE_API_URL) —
      # a single-job pipeline would have to inline the Pages upload
      # config into the gate, which is what we're trying to decouple.
      - name: Build
        # DR-018 fix: Resend email sending is backend-owned. The previous
        # workflow passed ${{ secrets.RESEND_API_KEY }} into the build as
        # VITE_RESEND_API_KEY, which would have inlined the email secret
        # into the public JS bundle at acschennai.com where anyone could
        # scrape it. The frontend only needs VITE_API_URL today.
        run: |
          export NODE_OPTIONS=--max-old-space-size=4096
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
