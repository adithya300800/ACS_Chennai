name: Deploy to GitHub Pages

on:
  push:
    branches: [ add-react-website ]
    paths-ignore:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install backend test dependencies
        # Backend __tests__/* require jsonwebtoken, bcryptjs, etc. which
        # are in backend/package.json (not the root). Without this the
        # test gate fails with "Cannot find module 'jsonwebtoken'" and
        # blocks the Pages deploy.
        run: npm ci --prefix backend --ignore-scripts
      # Round-7: gate frontend deploys on the existing test suite (api.js,
      # ErrorBoundary, auth context, blob upload, attendance). A failed
      # test now blocks GitHub Pages instead of pushing a regression to
      # users. Tests run from repo root using the root jest config which
      # pulls in the backend setup file for auth/pii env seeding.
      - name: Run tests
        run: npm test
      - name: Build
        run: |
          export NODE_OPTIONS=--max-old-space-size=4096
          npm run build
        env:
          VITE_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
