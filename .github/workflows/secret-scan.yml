# Round-26: lightweight secret scanner that runs on every push and PR.
#
# Two layers of defense:
#   1. gitleaks — scans the full git history for known provider/key formats.
#      Will catch accidental commits of new secrets AND surface any historical
#      ones that were missed in the previous remediation. Uses the standalone
#      open-source gitleaks binary (no paid licence, works on private repos).
#      Failures in the underlying binary -> workflow fails the build.
#   2. credential-marker — runs on every push and fails if a TRACKED FILE IN
#      HEAD contains a hard-coded credential pattern. Cheap, language-agnostic,
#      and catches the "I forgot to use an env var" case before it ships.
#      NOTE: this layer is HEAD-only by design — it greps the working tree,
#      so it cannot detect secrets added in historical commits that have since
#      been rewritten. That is gitleaks' job (layer 1). Do not claim otherwise.
#
# Why not just enable GitHub native secret scanning + push protection: those
# require repo admin + org-level toggles we can't reach from a workflow file.
# gitleaks mirrors their coverage locally and fails CI on findings, which is
# the contract the SOL report (LPR-002 / DR-001) demands.
name: Secret Scan

on:
  push:
    branches: [add-react-website, main]
  pull_request:
    branches: [add-react-website, main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so historical leaks surface
      - name: Download + verify gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
          # SHA256 of gitleaks_8.18.4_linux_x64.tar.gz from
          # https://github.com/gitleaks/gitleaks/releases/tag/v8.18.4
          # (gitleaks_8.18.4_checksums.txt). Pin, don't float.
          GITLEAKS_SHA256: "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"
        run: |
          set -euo pipefail
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail-with-body -o gitleaks.tar.gz "$URL"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version
      - name: Scan full history
        run: |
          set -euo pipefail
          # `gitleaks detect` reads .gitleaksignore from the repo root, where
          # the one known-triaged historical leak (LPR-002) is allowlisted.
          # Any OTHER finding — historical or new — fails the build.
          gitleaks detect \
            --source . \
            --report-path gitleaks-report.json \
            --report-format json \
            --verbose \
            --no-banner \
            --redact
      - name: Upload scan report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 14

  # Round-26: belt-and-suspenders literal-key check on the working tree of HEAD.
  # This is a HEAD-only tripwire: it greps tracked files in the current commit
  # for hard-coded credential patterns and fails the build if any are present.
  # It does NOT see git history — that is gitleaks' job above. Keep that
  # division of labour honest in this comment.
  credential-marker:
    name: Credential literal check (HEAD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (HEAD)
        uses: actions/checkout@v4
      - name: Scan tracked files for credential literals
        run: |
          set -euo pipefail
          # Patterns picked from the SOL finding's evidence file paths:
          #   - Resend live keys (re_...)
          #   - Zoho-style bearer/refresh tokens
          #   - SMTP / SendGrid keys
          #   - Generic high-entropy API-key strings
          PATTERNS=(
            "re_[A-Za-z0-9]{20,}"
            "1000\\.[A-Za-z0-9_\\-]{20,}\\.[A-Za-z0-9_\\-]{20,}"
            "SG\\.[A-Za-z0-9_\\-]{20,}\\.[A-Za-z0-9_\\-]{20,}"
            "AKIA[0-9A-Z]{16}"
            "-----BEGIN (RSA |OPENSSH |EC |DSA |PGP )?PRIVATE KEY-----"
          )
          # Exclude lockfiles, generated docs, and the SCRUBBED marker itself.
          EXCLUDES=(
            "package-lock.json"
            "backend/package-lock.json"
            "backend/package-lock 2.json"
            "REDACTED_USE_RESEND_API_KEY_ENV"
          )
          HITS=0
          for PAT in "${PATTERNS[@]}"; do
            COUNT=$(grep -RIlE "$PAT" \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=dist \
              --exclude="package-lock*.json" \
              --exclude="*.png" \
              --exclude="*.jpg" \
              . || true)
            if [ -n "$COUNT" ]; then
              # Filter to lines that are NOT the scrubbed marker
              REAL=$(echo "$COUNT" | while read -r file; do
                if grep -qE "$PAT" "$file" 2>/dev/null; then
                  if ! grep -q "REDACTED_USE_RESEND_API_KEY_ENV" "$file" 2>/dev/null || \
                     [ "$(grep -cE "$PAT" "$file" 2>/dev/null || 0)" -gt "$(grep -c 'REDACTED_USE_RESEND_API_KEY_ENV' "$file" 2>/dev/null || 0)" ]; then
                    echo "$file"
                  fi
                fi
              done)
              if [ -n "$REAL" ]; then
                echo "::error file=$PAT::credential literal pattern found"
                echo "$REAL"
                HITS=$((HITS+1))
              fi
            fi
          done
          if [ "$HITS" -gt 0 ]; then
            echo "::error::Tracked files contain credential literals — see LPR-002."
            exit 1
          fi
          echo "Credential literal scan clean."
